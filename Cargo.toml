[workspace]
resolver = "3"
members = [
    "apps/snacc",
    "apps/cargo-snacc",
    "apps/snacc-workbench",
    "crates/snacc-compiler",
    "crates/snacc-driver",
    "crates/snacc-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ariadne = "0.6.0"
chumsky = "0.13.0"
tempfile = "3.27.0"
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
inkwell = { version = "0.10.0", default-features = false }
