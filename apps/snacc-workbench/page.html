<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snacc Workbench</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131a; color: #e8edf7; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    .warning { color: #ffc96b; margin: 0 0 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .wide { grid-column: 1 / -1; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #3e485a; border-radius: 8px; background: #171c26; color: inherit; padding: 10px; font: 0.95rem ui-monospace, monospace; }
    textarea { min-height: 180px; resize: vertical; }
    #source { min-height: 270px; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; background: #75a7ff; color: #08101e; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .status { min-height: 1.5em; margin: 12px 0; }
    .panel { min-width: 0; border: 1px solid #3e485a; border-radius: 8px; padding: 12px; background: #171c26; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2em; margin: 8px 0 0; }
    .muted { color: #9ba8bd; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } main { width: min(100% - 20px, 600px); padding-top: 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>Snacc Workbench</h1>
    <p class="warning">This local tool compiles and executes native programs. Run trusted snippets only.</p>
    <div class="grid">
      <div class="wide">
        <label for="snippet">Snippet</label>
        <select id="snippet"><option>Loading snippets…</option></select>
      </div>
      <div class="wide">
        <label for="source">Snacc source</label>
        <textarea id="source" spellcheck="false"></textarea>
      </div>
      <div>
        <label for="stdin">Standard input</label>
        <textarea id="stdin" spellcheck="false" placeholder="Optional input"></textarea>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="run" type="button">Run</button>
        <p id="status" class="status" role="status" aria-live="polite">Ready.</p>
      </div>
      <section class="panel" aria-labelledby="diagnostics-label">
        <strong id="diagnostics-label">Compiler diagnostics</strong>
        <pre id="diagnostics" class="muted">(empty)</pre>
      </section>
      <section class="panel" aria-labelledby="result-label">
        <strong id="result-label">Process result</strong>
        <pre id="result" class="muted">(empty)</pre>
      </section>
      <section class="panel" aria-labelledby="stdout-label">
        <strong id="stdout-label">stdout</strong>
        <pre id="stdout" class="muted">(empty)</pre>
      </section>
      <section class="panel" aria-labelledby="stderr-label">
        <strong id="stderr-label">stderr</strong>
        <pre id="stderr" class="muted">(empty)</pre>
      </section>
    </div>
  </main>
  <script>
    const session = "__SNACC_SESSION_TOKEN__";
    const snippetSelect = document.querySelector("#snippet");
    const source = document.querySelector("#source");
    const stdin = document.querySelector("#stdin");
    const run = document.querySelector("#run");
    const status = document.querySelector("#status");
    const diagnostics = document.querySelector("#diagnostics");
    const result = document.querySelector("#result");
    const stdout = document.querySelector("#stdout");
    const stderr = document.querySelector("#stderr");
    let snippets = [];

    function show(element, value) {
      element.textContent = value || "(empty)";
      element.classList.toggle("muted", !value);
    }

    function markStale() {
      if (status.textContent.startsWith("Completed")) status.textContent = "Result is stale; press Run to refresh.";
    }

    async function loadSnippets() {
      const response = await fetch("/api/snippets", { headers: { "X-Snacc-Session": session } });
      if (!response.ok) throw new Error("snippet catalog request failed");
      snippets = await response.json();
      snippetSelect.textContent = "";
      snippets.forEach((item, index) => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.name;
        snippetSelect.appendChild(option);
        if (index === 0) { source.value = item.source; stdin.value = ""; }
      });
    }

    snippetSelect.addEventListener("change", () => {
      const item = snippets.find((candidate) => candidate.id === snippetSelect.value);
      if (item) { source.value = item.source; stdin.value = ""; markStale(); }
    });
    source.addEventListener("input", markStale);
    stdin.addEventListener("input", markStale);

    async function execute() {
      run.disabled = true;
      status.textContent = "Compiling…";
      try {
        const response = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Snacc-Session": session },
          body: JSON.stringify({ source: source.value, stdin: stdin.value })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "request failed");
        const compile = payload.compile;
        if (compile.status === "failed") {
          show(diagnostics, compile.diagnostics.map((item) => `${item.phase}: ${item.message}`).join("\n"));
          show(result, "Compilation failed"); show(stdout, ""); show(stderr, "");
          status.textContent = "Completed with compiler diagnostics.";
          return;
        }
        const execution = payload.execution;
        show(diagnostics, "");
        show(stdout, execution.stdout + (execution.stdoutTruncated ? "\n[output truncated]" : ""));
        show(stderr, execution.stderr + (execution.stderrTruncated ? "\n[output truncated]" : ""));
        show(result, `status: ${execution.status}\nexit code: ${execution.exitCode ?? "(none)"}\ncompile: ${compile.durationMs.toFixed(2)} ms\nrun: ${execution.durationMs.toFixed(2)} ms\ntotal: ${payload.totalMs.toFixed(2)} ms`);
        status.textContent = "Completed.";
      } catch (error) {
        show(diagnostics, String(error)); show(result, "Request failed");
        status.textContent = "Completed with a workbench error.";
      } finally { run.disabled = false; }
    }

    run.addEventListener("click", execute);
    source.addEventListener("keydown", (event) => { if (event.ctrlKey && event.key === "Enter") { event.preventDefault(); execute(); } });
    stdin.addEventListener("keydown", (event) => { if (event.ctrlKey && event.key === "Enter") { event.preventDefault(); execute(); } });
    loadSnippets().catch((error) => { status.textContent = String(error); snippetSelect.textContent = "Unavailable"; });
  </script>
</body>
</html>
